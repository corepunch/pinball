name: Re-record and tune levels (temporary)
# Temporary: re-records route contracts and calibrates level goals/stars on macOS, then commits them.
on:
  pull_request:
permissions:
  contents: write
jobs:
  tune:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Re-record contracts
        run: for t in aurora meridian tide; do python3 tools/rerecord_contracts.py $t --write || echo "RESULT $t unresolved"; done
      - name: Verify strict suites and shots
        run: |
          python3 tools/playtest/run_shots.py aurora meridian tide || echo "RESULT shots failed"
          for t in aurora meridian tide; do
            if python3 tools/analyze_table.py GameData/Tables/$t.json --suite GameData/Analysis/$t.json --strict --out /tmp/out-$t > /tmp/a.log 2>&1; then echo "STRICT $t PASS"; else echo "STRICT $t FAIL $(grep -o 'analysis: .*' /tmp/a.log)"; fi
          done
      - name: Tune goals and stars
        run: python3 tools/playtest/run_playtests.py --games 60 --tune || echo "RESULT playtest problems"
      - name: Commit
        run: |
          git add GameData/Analysis GameData/Levels.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-record route contracts and tune level goals"
          for attempt in 1 2 3; do git pull --rebase origin "$GITHUB_HEAD_REF" && git push && exit 0; sleep 5; done
          exit 1
