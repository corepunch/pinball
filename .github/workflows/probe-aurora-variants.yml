name: Probe slingshot corner radius (temporary)
# Temporary: strict route analysis and shot playtest for each candidate slingshot corner radius.
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Analysis and shots per variant
        run: |
          python3 -c "import sys; sys.path.insert(0,'tools/playtest'); import run_shots; run_shots.build()"
          for v in orig r008 r010 r012 r014 r016; do
            line="$v:"
            for t in aurora meridian tide; do
              if CLANG_MODULE_CACHE_PATH=/tmp/mc python3 tools/analyze_table.py probe/$v/$t.json --suite GameData/Analysis/$t.json --strict --out /tmp/out-$v-$t > /tmp/a.log 2>&1; then a=pass; else a="FAIL($(grep -o 'analysis: .*' /tmp/a.log | head -1 | grep -o 'requires' | wc -l | tr -d ' '))"; fi
              s=$(./Build/shots probe/$v/$t.json | python3 -c "import json,sys; r=json.load(sys.stdin); m=set().union(*[set(f['reached']) for f in r.values()]); print('orbits ' + ','.join(o for o in ('orbit left','orbit right') if o in m))")
              line="$line  $t analysis=$a $s;"
            done
            echo "RESULT $line"
          done
